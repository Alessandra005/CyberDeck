<body>
  <!-- The base artwork is rendered directly from the user's supplied radio-design PDF. -->
  <main class="radio-art" aria-label="WiCS CyberDeck vintage radio controls">
    <section class="display" id="display" aria-label="Radio dial">
      <div class="screen-top">
        <span id="band-label">NOAA WEATHER BAND</span>
        <span class="status-indicator"><span class="status-led" aria-hidden="true"></span><span id="status">STANDBY</span></span>
      </div>

      <div class="readout-line">
        <button class="readout-frequency" id="freq-button" aria-label="Current frequency; click to type FM frequency" title="In FM mode, click to type a frequency">162.400</button>
        <input class="edit-frequency" id="freq-input" type="number" min="87.5" max="108" step="0.1" inputmode="decimal" aria-label="Enter FM frequency in MHz" aria-describedby="message" />
        <span class="readout-unit">MHz</span>
      </div>

      <div class="dial-wrap">
        <div class="dial-bar" id="dial-bar" role="slider" tabindex="0" aria-label="Frequency tuning dial" aria-valuemin="162.4" aria-valuemax="162.55" aria-valuenow="162.4" aria-valuetext="162.400 megahertz NOAA">
          <div id="ticks"></div>
          <div class="needle" id="needle" aria-hidden="true"></div>
        </div>
        <div class="dial-info">
          <span id="dial-left">CH 01 / 07</span>
          <div class="preset-strip" id="presets" aria-label="FM station presets"></div>
          <span id="dial-right">USE ◀ ▶ TO TUNE</span>
        </div>
      </div>
    </section>

    <button class="hotspot mode noaa" id="noaa" type="button" aria-label="NOAA weather radio" aria-pressed="true"><span class="touch-target" aria-hidden="true"></span></button>
    <button class="hotspot mode fm" id="fm" type="button" aria-label="FM broadcast radio" aria-pressed="false"><span class="touch-target" aria-hidden="true"></span></button>
    <button class="hotspot arrow left" id="previous" type="button" aria-label="Previous frequency"><span class="touch-target" aria-hidden="true"></span></button>
    <button class="hotspot arrow right" id="next" type="button" aria-label="Next frequency"><span class="touch-target" aria-hidden="true"></span></button>
    <button class="hotspot transport start" id="start" type="button" aria-label="Start playing selected radio station"><span class="touch-target" aria-hidden="true"></span></button>
    <button class="hotspot transport stop" id="stop" type="button" aria-label="Stop radio playback"><span class="touch-target" aria-hidden="true"></span></button>
  </main>
  <div class="radio-message" id="message" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script>
  (() => {
    'use strict';

    const FM_MIN = 87.5, FM_MAX = 108.0, FM_STEP = 0.1;

    const $ = id => document.getElementById(id);
    const el = {
      display: $('display'), band: $('band-label'), status: $('status'),
      freq: $('freq-button'), input: $('freq-input'),
      dial: $('dial-bar'), ticks: $('ticks'), needle: $('needle'),
      left: $('dial-left'), right: $('dial-right'), presets: $('presets'),
      noaa: $('noaa'), fm: $('fm'), previous: $('previous'), next: $('next'),
      start: $('start'), stop: $('stop'), message: $('message')

    const state = {
      band: 'noaa', freq: NOAA[0], active: null, operation: null,
      playbackUnknown: false, lateTunePossible: false, notice: '', error: false

    let presetButtons = [];
    const isLocalPreview = window.location.protocol === 'file:';
    const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

    }
    function renderPlayback() {
      const active = state.active;

      let message = state.notice;
      if (state.operation) {
        status = state.operation.kind === 'tune' ? 'TUNING…' : 'STOPPING…';
      } else if (state.playbackUnknown) {
        status = 'CHECK RADIO';
        message += `${message ? '\n' : ''}Playback is unconfirmed.${active ? ` Last confirmed: ${stationName(active)}.` : ''} Press STOP to stop the host, or START to retry.`;
      } else if (active) {
        status = changed ? 'RETUNE' : active.demo ? 'DEMO · NO AUDIO' : 'ON AIR';
        if (changed) {
          message += `${message ? '\n' : ''}${active.demo ? 'Previewing' : 'Playing'} ${stationName(active)}. Selected ${stationName(state)}. Press START to retune.`;

      el.display.classList.toggle('is-error', state.error);

      if (state.band === 'noaa') {
        NOAA.forEach((freq) => {
          const tick = document.createElement('span');
          tick.className = 'tick major';
          tick.style.left = `${position(freq)}%`;
          ticks.appendChild(tick);
          const label = document.createElement('span');
          label.className = 'tick-label';
          label.style.left = `${position(freq)}%`;
          // Show the full three-decimal weather frequency on the scale.
          label.textContent = freq.toFixed(3);
          ticks.appendChild(label);
        });
      } else {
        // FM ticks every 0.5 MHz, with a printed number every 2 MHz.
        for(let tenth=875; tenth<=1080; tenth+=5) {
          const freq = tenth/10;
          const isMajor = tenth===875 || tenth===1080 || (tenth >= 900 && tenth % 20 === 0);
          const isMedium = !isMajor && (tenth % 10===0);
          const tick = document.createElement('span');
          tick.className = `tick${isMajor?' major':isMedium?' medium':''}`;
          tick.style.left = `${position(freq)}%`;
          ticks.appendChild(tick);
          if (isMajor) {
            const label=document.createElement('span');
            label.className='tick-label';
            label.style.left=`${position(freq)}%`;
            label.textContent=Number.isInteger(freq) ? String(freq) : freq.toFixed(1);

    }

      el.presets.replaceChildren();

        const caption=document.createElement('span');
        caption.textContent='7 WEATHER CHANNELS';
        el.presets.appendChild(caption);
        return;
      }
      FM_PRESETS.forEach(freq => {
        const btn=document.createElement('button');
        btn.type='button'; btn.className='preset';
        btn.textContent=freq.toFixed(1);
        btn.title=`Tune to FM ${freq.toFixed(1)} MHz`;
        btn.setAttribute('aria-label',`FM preset ${freq.toFixed(1)} MHz`);
        btn.addEventListener('click', () => selectFrequency(freq));

      });
    }
    function render() {
      const isNoaa = state.band==='noaa';
      const [min,max]=scaleBounds();
      el.band.textContent = isNoaa ? 'NOAA WEATHER BAND' : 'FM BROADCAST BAND';
      el.freq.textContent = formatted();
      el.freq.setAttribute('aria-label', `Selected ${stationName(state)}${isNoaa ? '' : '; activate to type an FM frequency'}`);
      el.needle.style.setProperty('--position', `${clamp(position(state.freq),0,100)}%`);

      el.dial.setAttribute('aria-valuetext',`${formatted()} megahertz ${isNoaa?'NOAA':'FM'}`);

      el.left.textContent=isNoaa?`CH ${String(channel+1).padStart(2,'0')} / 07`:'FM · 87.5–108 MHz';
      el.right.textContent=isNoaa?'USE ◀ ▶ TO TUNE':'CLICK DIAL OR MHz TO TUNE';

      el.start.disabled = busy;
      // STOP can interrupt tuning; its own request is bounded by a timeout.
      el.stop.disabled = state.operation?.kind === 'stop';

      render();
    }
    function switchBand(next) {
      if (state.operation || next===state.band) return;
      endFrequencyEntry(false, false);

      state.freq=next==='noaa'?NOAA[0]:FM_PRESETS[0];

    function stepFrequency(direction) {
      if(state.operation)return;

      const operation = { kind: 'tune', responded: false, cancel: null };
      state.operation = operation;
      feedback(`Tuning ${stationName(station)}… STOP remains available.`);render();
      try {
        if (isLocalPreview) {
          feedback(`Previewing ${stationName(station)}. DEMO — NO AUDIO. Real playback requires Flask and RTL-SDR hardware.`);
        } else {
          const query = new URLSearchParams({freq:formatted(station),type:station.band});
          await radioRequest(operation, `/radio/tune?${query.toString()}`, 'GET', station);
          if(state.operation !== operation)return;
          feedback(`Playing ${stationName(station)}. Audio plays through the radio host device.`);
        }
        state.active = station;
        // A successful retry cannot prove an older interrupted request is gone.
        state.playbackUnknown = state.lateTunePossible;
        if(state.playbackUnknown) {
          feedback(`Tune acknowledged for ${stationName(station)}. An earlier tune request may still finish on the host.`);
        }
      } catch(e) {
        if(state.operation !== operation)return;
        state.playbackUnknown = true;
        state.lateTunePossible ||= !operation.responded;
        feedback(`Tuning failed: ${e.message}`, true);
        console.error('[WiCS Radio]',e);
      } finally {
        if(state.operation === operation) {state.operation = null;render();}
      }
    }
    async function stopRadio() {
      if(state.operation?.kind === 'stop')return;
      const previous = state.operation;
      const operation = { kind: 'stop', responded: false, cancel: null };
      state.operation = operation;
      if(previous) {
        state.lateTunePossible ||= !previous.responded;
        state.playbackUnknown = true;
        previous.cancel?.('Tuning interrupted by STOP.');
      }
      endFrequencyEntry(false, false);
      feedback('Stopping radio playback…');render();
      try {
        if(!isLocalPreview) {
          await radioRequest(operation, '/radio/stop', 'POST');
          if(state.operation !== operation)return;
        }
        state.active = null;
        // Aborting fetch cannot cancel server-side work. A late tune can run
        // after STOP, so do not claim confirmed silence in that case.
        state.playbackUnknown = state.lateTunePossible;
        feedback(state.lateTunePossible
          ? 'STOP acknowledged. An earlier tune request may still finish on the host. If audio continues or resumes, press STOP again.'
          : 'Radio stopped.');
      } catch(e) {
        if(state.operation !== operation)return;
        state.playbackUnknown = true;
        feedback(`Could not stop radio: ${e.message}`, true);
        console.error('[WiCS Radio]',e);
      } finally {
        if(state.operation === operation) {state.operation = null;render();}
      }
    }
    el.noaa.addEventListener('click',()=>switchBand('noaa'));
    el.fm.addEventListener('click',()=>switchBand('fm'));
    el.previous.addEventListener('click',()=>stepFrequency(-1));
    el.next.addEventListener('click',()=>stepFrequency(1));
    el.start.addEventListener('click',startRadio);
    el.stop.addEventListener('click',stopRadio);
    el.freq.addEventListener('click',beginFrequencyEntry);
    el.input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();endFrequencyEntry(true);}
      else if(e.key==='Escape'){e.preventDefault();endFrequencyEntry(false);}
    });
    el.input.addEventListener('blur',()=>endFrequencyEntry(true, false));
    el.dial.addEventListener('pointerdown',e=>{
      if(state.operation)return;
      el.dial.setPointerCapture(e.pointerId);jumpFromDial(e.clientX);
    });
    el.dial.addEventListener('pointermove',e=>{
      if(el.dial.hasPointerCapture(e.pointerId))jumpFromDial(e.clientX);
    });
    el.dial.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight' || e.key==='ArrowUp') { e.preventDefault();stepFrequency(1); }
      if(e.key==='ArrowLeft' || e.key==='ArrowDown') { e.preventDefault();stepFrequency(-1); }
      if(e.key==='Home'){e.preventDefault();selectFrequency(scaleBounds()[0]);}
      if(e.key==='End'){e.preventDefault();selectFrequency(scaleBounds()[1]);}
    });
    renderTicks();renderPresets();render();
  })();
  </script>
</body>
</html>
